plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.trappychinchompa.TrappyChinchompaPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
	testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'

	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

tasks.named('test', Test) {
	useJUnitPlatform()
}

group = 'com.trappychinchompa'
version = '2.0.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea",
		"--add-opens=java.desktop/com.apple.eawt=ALL-UNNAMED",
		"--add-opens=java.base/java.net=ALL-UNNAMED",
		"--add-opens=java.base/java.io=ALL-UNNAMED"
	args "--developer-mode", "--debug"
}

// Two clients at once (duel testing): `./gradlew run` holds Gradle's project
// lock for as long as the client lives, so a second `run` just waits. This
// writes a plain launcher script instead; scripts/run_clients.sh uses it.
tasks.register('clientScript') {
	group = 'trappy chinchompa'
	description = 'Write build/run-client.sh, which launches a dev client without Gradle.'
	dependsOn 'testClasses'
	doLast {
		def script = file("${buildDir}/run-client.sh")
		def cp = sourceSets.test.runtimeClasspath.files.collect { it.absolutePath }.join(':')
		script.text = """#!/bin/sh
# Generated by ./gradlew clientScript - a dev client with the plugin sideloaded.
exec java -ea \\
  --add-opens=java.desktop/com.apple.eawt=ALL-UNNAMED \\
  --add-opens=java.base/java.net=ALL-UNNAMED \\
  --add-opens=java.base/java.io=ALL-UNNAMED \\
  -cp '${cp}' \\
  ${pluginMainClass} --developer-mode --debug "\$@"
"""
		script.setExecutable(true)
	}
}

tasks.register('golden', JavaExec) {
	group = 'trappy chinchompa'
	description = 'Write build/golden.json: replay vectors for the relay simulation port.'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.trappychinchompa.duel.GoldenVectors'
	args "${buildDir}/golden.json"
}

tasks.register('checkTokens', Exec) {
	group = 'verification'
	description = 'Plugin Hub 200k-token source-size gate.'
	commandLine 'python3', 'scripts/check_tokens.py'
}

tasks.register('checkGlyphs', Exec) {
	group = 'verification'
	description = 'Flag macOS-Tahoe tofu-prone glyphs in UI strings.'
	commandLine 'python3', 'scripts/check_glyphs.py'
}

// Contact sheet of every zone backdrop, no client needed: ./gradlew backdrops
tasks.register('backdrops', JavaExec) {
	group = 'trappy chinchompa'
	description = 'Render all zone backdrops to build/backdrops.png for art review.'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.trappychinchompa.ui.BackdropGallery'
}

tasks.register('preSubmit') {
	group = 'verification'
	description = 'Pre-submission checks for a Plugin Hub update (test + checkTokens + checkGlyphs).'
	dependsOn 'test', 'checkTokens', 'checkGlyphs'
}
